[main]
# Window geometry
width=38
lines=10
horizontal-pad=16
vertical-pad=10
inner-pad=8
line-height=20
font=JetBrainsMono Nerd Font:size=11

# Icon theme (installed with adwaita-icon-theme)
icon-theme=Adwaita

# Default anchor for fuzzel menus (centered like before)
anchor=center
x-margin=0
y-margin=0

[colors]
# Dark background matching the bar
background=08080aff
# Light text for unselected items
text=e8e8ecff
# Matched characters in unselected items (subtle)
match=888888ff
# Selection: white background
selection=ffffffff
# Selection text: near-black (high contrast on white)
selection-text=08080aff
# Matched chars in selection: also near-black
selection-match=08080aff
# Border
border=26262cff

[border]
radius=10
width=1